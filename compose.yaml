services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20
    ports:
      - "127.0.0.1:15672:15672"
  migrate:
    build: .
    command: python -m app.init_db
    environment: &env
      DATABASE_URL: postgresql+psycopg://taskflow:${POSTGRES_PASSWORD:-local_dev_password}@db:5432/taskflow
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      API_KEY: ${API_KEY:-local-development-key}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    build: .
    ports:
      - "127.0.0.1:8003:8000"
    environment: *env
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: python -m app.worker
    environment: *env
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
